<section class="services" id="services" data-screen-label="03 Services">
  <div class="bg-glow red breathe"></div>
  <div class="container">
    <div class="section-head" data-reveal>
      <span class="eyebrow">Services</span>
      <h2>What we do?</h2>
      <p>From design and development to optimization, integrations, AI, and ongoing support.</p>
    </div>

    <div class="services-grid">
      @for (service of catalog.services; track service.id; let i = $index) {
        <a
          class="service-card"
          data-reveal
          [style.--delay.ms]="(i % 3) * 80"
          [routerLink]="['/services', service.id]"
          [attr.aria-label]="'Learn more about ' + service.title"
        >
          <div class="service-icon" aria-hidden="true" [innerHTML]="service.icon"></div>
          <h3>{{ service.title }}</h3>
          <p>{{ service.short }}</p>
          <div class="service-meta">
            <span>{{ service.num }} → {{ service.label }}</span>
            <svg class="arrow" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
          </div>
        </a>
      }
    </div>
  </div>
</section>

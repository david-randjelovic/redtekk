<section class="final-cta" id="contact" data-screen-label="07 Final CTA">
  <div class="final-cta-bg" aria-hidden="true">
    <div class="bg-grid drift"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
    <div class="scan-beam"></div>
  </div>

  <div class="container final-cta-inner">
    <span class="eyebrow center" data-reveal>Let's build</span>
    <h2 data-reveal style="--delay: 80ms">Let's build something that lasts.</h2>
    <p data-reveal style="--delay: 160ms">Whether you're launching a new product, improving an existing one, or looking for a team you can rely on long-term, we're ready to help.</p>

    <div class="final-cta-buttons" data-reveal style="--delay: 240ms">
      <app-button label="Book a call" (click)="calendar.open()" />
      <app-button
        href="mailto:hello@redtekk.com"
        variant="ghost"
        label="hello@redtekk.com"
        [showArrow]="false"
      />
    </div>

    <div class="final-cta-meta" data-reveal style="--delay: 320ms">
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Reply within 4 hours
      </span>
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Senior team from day one
      </span>
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Long-term technical partner
      </span>
    </div>
  </div>
</section>

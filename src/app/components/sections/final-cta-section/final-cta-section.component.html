<section class="final-cta" id="contact" data-screen-label="10 Final CTA">
  <div class="final-cta-bg" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="glow-a"></div>
    <div class="glow-b"></div>
  </div>

  <div class="container final-cta-inner">
    <span class="eyebrow center" data-reveal>Let's build something that lasts</span>
    <h2 data-reveal style="--delay: 80ms">A 30-minute call.<br />A relationship that <em>outlasts</em> the launch.</h2>
    <p data-reveal style="--delay: 160ms">
      Tell us what you're building. We'll respond within four hours with honest thinking, whether or not we're the right team for it.
    </p>

    <div class="final-cta-buttons" data-reveal style="--delay: 240ms">
      <app-button href="#" label="Book a call" />
      <app-button
        href="mailto:hello@redtekk.com"
        variant="ghost"
        label="hello@redtekk.com"
        [showArrow]="false"
      />
    </div>

    <div class="final-cta-meta" data-reveal style="--delay: 320ms">
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Reply within 4 hours
      </span>
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Fixed-scope first sprint
      </span>
      <span>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5" /></svg>
        Senior team from day one
      </span>
    </div>
  </div>
</section>
